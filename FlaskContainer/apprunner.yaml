version: 1.0
runtime: python311
build:
  commands:
    pre-build:
      - echo "pre build"
    build:        
      - pip3 install -r requirements.txt
    post-build:
      - echo "post build"
  env:
    - name: MY_VAR_EXAMPLE
      value: "example"
run:
  runtime-version: 3.11
  pre-run:  
    - pip3 install -r requirements.txt
  command: python3 main.py
  network: 
    port: 5000  
  env:
    - name: MY_VAR_EXAMPLE
      value: "example"